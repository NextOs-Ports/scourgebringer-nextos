name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file

      - name: Run adapter host tests
        run: ./tests/run-host.sh

      - name: Validate repository and release contracts
        run: python3 -B tests/test_repository_contract.py

      - name: Parse every shell entrypoint
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -path ./.git -prune -o -type f -name '*.sh' -print0)

      - name: Require a clean generated state
        run: git diff --exit-code
